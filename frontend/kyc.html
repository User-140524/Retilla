<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Verify Your Identity — Rentilla</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f7f7f8;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 1.5rem;
  }
  .kyc-card {
    background: #fff;
    border-radius: 14px;
    max-width: 440px;
    width: 100%;
    padding: 2rem;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
  }
  .kyc-card h1 { font-size: 1.4rem; margin-bottom: 0.5rem; }
  .kyc-card p { color: #555; margin-bottom: 1.5rem; line-height: 1.5; }
  .kyc-btn {
    width: 100%;
    padding: 0.85rem;
    border: none;
    border-radius: 10px;
    background: #111;
    color: #fff;
    font-size: 1rem;
    cursor: pointer;
  }
  .kyc-btn:disabled { opacity: 0.6; cursor: not-allowed; }
  .kyc-status { margin-top: 1rem; font-size: 0.9rem; min-height: 1.2em; }
  .kyc-status.error { color: #c0392b; }
  .kyc-status.pending { color: #b8860b; }
  .kyc-status.success { color: #1e8e3e; }
  .kyc-back { display: inline-block; margin-top: 1.25rem; color: #666; font-size: 0.85rem; }
</style>
</head>
<body>

  <div class="kyc-card">
    <h1>Verify your identity</h1>
    <p>
      To complete your purchase, we need to verify your identity via
      DigiLocker. This is quick, secure, and uses your Aadhaar —
      we never see or store your Aadhaar number or ID image directly.
    </p>

    <button id="startKycBtn" class="kyc-btn">Verify with DigiLocker</button>
    <div id="kycStatusMsg" class="kyc-status"></div>

    <a href="dashboard.html" class="kyc-back">← Back to Dashboard</a>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/kyc.js"></script>
</body>
</html>
